<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元代謝・給你的健康旅程</title>
<style>
:root{
  --ink:#0F6E56; --ink2:#158066; --deep:#0A4A3A; --mint:#EFF7F3; --paper:#FDFDFB;
  --dark:#243430; --soft:#5A6B64; --gold:#E0A93E; --coral:#E8896B;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--deep)}
#stage{position:fixed;inset:0;background:linear-gradient(165deg,#0A4A3A 0%,#0F6E56 55%,#158066 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}

/* 場景 */
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .8s;pointer-events:none;padding:32px 26px}
.scene.on{opacity:1}
.big{font-family:"Noto Serif TC",serif;color:#fff;font-weight:900;line-height:1.4;letter-spacing:.04em;text-shadow:0 2px 20px rgba(0,0,0,.2)}
.sub{color:rgba(255,255,255,.82);margin-top:18px;line-height:1.9;letter-spacing:.03em}
.accent{color:#8FE8C6}

/* 花園生長 */
.plant{font-size:clamp(60px,17vw,120px);transition:all 1.2s cubic-bezier(.34,1.4,.6,1);filter:drop-shadow(0 8px 24px rgba(0,0,0,.25))}
.floaty{animation:floaty 3.5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.orbit{position:absolute;font-size:26px;opacity:0}
.orbit.show{opacity:1;animation:orbit 5s linear infinite}
@keyframes orbit{from{transform:rotate(0) translateX(90px) rotate(0)}to{transform:rotate(360deg) translateX(90px) rotate(-360deg)}}

/* 三個承諾卡 */
.cards{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;justify-content:center;max-width:520px}
.pcard{background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:18px 16px;min-width:120px;opacity:0;transform:translateY(20px);transition:all .7s}
.pcard.in{opacity:1;transform:none}
.pcard .ic{font-size:34px;margin-bottom:8px}
.pcard .tt{color:#fff;font-weight:800;font-size:15px;margin-bottom:4px}
.pcard .ds{color:rgba(255,255,255,.72);font-size:11.5px;line-height:1.6}

/* 數字跳動 */
.stat-row{display:flex;gap:30px;margin-top:24px;flex-wrap:wrap;justify-content:center}
.statb{opacity:0;transform:scale(.7);transition:all .6s}
.statb.in{opacity:1;transform:none}
.statb .n{font-size:clamp(30px,8vw,48px);font-weight:900;color:#8FE8C6;font-family:"Noto Serif TC",serif}
.statb .l{color:rgba(255,255,255,.75);font-size:12px;margin-top:2px}

/* 光暈 */
.halo{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(143,232,198,.25),transparent 70%);opacity:0;transition:opacity 1s}
.halo.show{opacity:1;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* 秘書陪伴 */
.companions{display:flex;gap:-10px;margin-top:20px}
.av{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:24px;margin-left:-8px;opacity:0;transform:scale(.5);transition:all .5s}
.av.in{opacity:1;transform:none}

/* logo 收尾 */
.logo{font-family:"Noto Serif TC",serif;font-size:clamp(30px,8vw,48px);font-weight:900;color:#fff;letter-spacing:.1em}
.tagline{color:#8FE8C6;font-size:clamp(14px,3.4vw,18px);margin-top:12px;letter-spacing:.14em;font-weight:600}

/* 控制列 */
#bar{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:50}
.pbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
#prog{flex:1;height:5px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
#progfill{height:100%;width:0%;background:#8FE8C6;border-radius:99px;transition:width .3s linear}
#skip{color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;text-decoration:underline;font-family:inherit;background:none;border:none}

#tapstart{position:fixed;inset:0;background:linear-gradient(165deg,#0A4A3A,#158066);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:80;cursor:pointer;text-align:center;padding:30px}
#tapstart .play{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;margin-bottom:20px;animation:floaty 2.5s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="halo" id="halo"></div>
  <div id="scenes"></div>
</div>

<div id="tapstart" onclick="startShow()">
  <div class="play">▶</div>
  <div style="color:#fff;font-size:20px;font-weight:800;font-family:'Noto Serif TC',serif;letter-spacing:.05em">給你的健康旅程</div>
  <div style="color:rgba(255,255,255,.7);font-size:13px;margin-top:10px">約 90 秒・點擊開始</div>
</div>

<div id="bar" style="display:none">
  <span id="music-btn" onclick="toggleMusic()" style="cursor:pointer;font-size:18px;padding:0 8px" title="音樂開關">🎵</span>
  <button class="pbtn" id="pbtn" onclick="togglePlay()">⏸</button>
  <div id="prog"><div id="progfill"></div></div>
  <button id="skip" onclick="skipShow()">跳過</button>
</div>

<script>
const SCENES = [
  { html:`<div class="scene"><div class="plant floaty" id="s0-plant">🌱</div>
    <div class="big" style="font-size:clamp(22px,5.4vw,34px);margin-top:24px">歡迎來到<br>你的代謝健康旅程</div>
    <div class="sub" style="font-size:clamp(13px,3.2vw,16px)">接下來的每一天<br>我們會陪著你，一起照顧身體</div></div>`,
    dur:5200, act:(r)=>{ setTimeout(()=>{const p=r.querySelector('#s0-plant');if(p)p.textContent='🌿';},2600); } },

  { html:`<div class="scene"><div class="big" style="font-size:clamp(20px,4.8vw,30px)">這趟旅程<br>不是<span class="accent">節食</span>，也不是<span class="accent">減肥</span></div>
    <div class="sub" style="font-size:clamp(14px,3.4vw,17px);margin-top:22px">而是讓身體的<br><span class="accent" style="font-weight:800">粒線體回春</span><br>找回原本該有的健康</div></div>`,
    dur:5400 },

  { html:`<div class="scene"><div class="big" style="font-size:clamp(20px,4.8vw,28px);margin-bottom:6px">我們照顧你的三件事</div>
    <div class="cards">
      <div class="pcard" id="c1"><div class="ic">🍽</div><div class="tt">每天的餐盤</div><div class="ds">吃對油脂與蛋白質<br>身體自然會回應</div></div>
      <div class="pcard" id="c2"><div class="ic">🩸</div><div class="tt">身體的數據</div><div class="ds">血酮、體重、腰圍<br>看見自己的改變</div></div>
      <div class="pcard" id="c3"><div class="ic">🌱</div><div class="tt">代謝的花園</div><div class="ds">每天照顧一點<br>小樹就會長大</div></div>
    </div></div>`,
    dur:5800, act:(r)=>{ ['c1','c2','c3'].forEach((id,i)=>setTimeout(()=>{const e=r.querySelector('#'+id);if(e)e.classList.add('in');},400+i*500)); } },

  { html:`<div class="scene"><div class="plant" id="s3-plant" style="font-size:clamp(70px,20vw,140px)">🌿</div>
    <div class="orbit" id="o1" style="top:38%">🦋</div><div class="orbit" id="o2" style="top:38%">✨</div>
    <div class="big" style="font-size:clamp(19px,4.6vw,26px);margin-top:20px">你每照顧身體一次<br>花園就成長一點</div>
    <div class="sub" style="font-size:clamp(13px,3.2vw,16px)">堅持會被看見，努力會開花</div></div>`,
    dur:5600, act:(r)=>{ setTimeout(()=>{const p=r.querySelector('#s3-plant');if(p){p.textContent='🌳';p.style.transform='scale(1.15)';}},1400);
      setTimeout(()=>{r.querySelector('#o1')&&r.querySelector('#o1').classList.add('show');},2400);
      setTimeout(()=>{r.querySelector('#o2')&&r.querySelector('#o2').classList.add('show');},3000); } },

  { html:`<div class="scene"><div class="big" style="font-size:clamp(20px,4.8vw,28px)">你不是一個人在努力</div>
    <div class="companions" id="comps">
      <div class="av" id="a1">👩‍⚕️</div><div class="av" id="a2">🧑‍⚕️</div><div class="av" id="a3">💚</div></div>
    <div class="sub" style="font-size:clamp(14px,3.4vw,17px);margin-top:20px">專屬健康秘書<br>隨時在 LINE 陪著你<br>有問題，隨時問</div></div>`,
    dur:5400, act:(r)=>{ ['a1','a2','a3'].forEach((id,i)=>setTimeout(()=>{const e=r.querySelector('#'+id);if(e)e.classList.add('in');},500+i*400)); } },

  { html:`<div class="scene"><div class="big" style="font-size:clamp(19px,4.6vw,26px);margin-bottom:4px">改變，是一天一天累積的</div>
    <div class="stat-row">
      <div class="statb" id="st1"><div class="n">每天</div><div class="l">記錄一次</div></div>
      <div class="statb" id="st2"><div class="n">一掌心</div><div class="l">蛋白質</div></div>
      <div class="statb" id="st3"><div class="n">八成</div><div class="l">好油脂</div></div>
    </div>
    <div class="sub" style="font-size:clamp(13px,3.2vw,16px);margin-top:24px">有了好的前面<br>才會有好的後面</div></div>`,
    dur:5400, act:(r)=>{ ['st1','st2','st3'].forEach((id,i)=>setTimeout(()=>{const e=r.querySelector('#'+id);if(e)e.classList.add('in');},400+i*450)); } },

  { html:`<div class="scene"><div class="plant floaty">🌳</div>
    <div class="logo" style="margin-top:20px">元代謝</div>
    <div class="tagline">一起，找回身體的原廠設定</div>
    <div class="sub" style="font-size:clamp(13px,3.2vw,15px);margin-top:22px">現在，就從今天的第一筆記錄開始 🌱</div></div>`,
    dur:5200, act:()=>{ document.getElementById('halo').classList.add('show'); } },
];

let idx=0, playing=false, timer=null, token=0;
const scenesBox=document.getElementById('scenes');

function renderScene(i){
  scenesBox.innerHTML = SCENES[i].html;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const sc=scenesBox.querySelector('.scene'); if(sc)sc.classList.add('on');
  }));
  if(SCENES[i].act) try{ SCENES[i].act(scenesBox); }catch(e){}
}
function playFrom(i){
  if(!playing) return;
  if(i>=SCENES.length){ finish(); return; }
  idx=i; renderScene(i);
  const my=++token;
  const dur=SCENES[i].dur||5000;
  animateProg(i, dur);
  timer=setTimeout(()=>{ if(playing&&my===token) playFrom(i+1); }, dur);
}
function animateProg(i, dur){
  const total=SCENES.length;
  const start=i/total*100, end=(i+1)/total*100;
  const fill=document.getElementById('progfill');
  fill.style.transition='none'; fill.style.width=start+'%';
  requestAnimationFrame(()=>{ fill.style.transition='width '+dur+'ms linear'; fill.style.width=end+'%'; });
}
function togglePlay(){
  playing=!playing;
  document.getElementById('pbtn').textContent = playing?'⏸':'▶';
  if(playing){ playFrom(idx); } else { clearTimeout(timer); token++;
    const fill=document.getElementById('progfill');
    fill.style.transition='none';
  }
}
function startShow(){
  document.getElementById('tapstart').style.display='none';
  startMusic();
  document.getElementById('bar').style.display='flex';
  playing=true; playFrom(0);
}
function skipShow(){ stopMusic(); finish(); }
function finish(){ stopMusic();
  playing=false; clearTimeout(timer);
  idx=SCENES.length-1; renderScene(idx);
  document.getElementById('progfill').style.width='100%';
  document.getElementById('pbtn').textContent='↺';
  document.getElementById('pbtn').onclick=function(){ document.getElementById('pbtn').onclick=togglePlay; idx=0; playing=true; togglePlay(); togglePlay(); startShow(); };
  // 通知父層（前台可監聽）
  try{ if(window.parent!==window) window.parent.postMessage('intro-done','*'); }catch(e){}
}

// ══════ 背景音樂（Web Audio 即時合成，無版權疑慮）══════
var _audioCtx = null, _musicOn = false, _musicNodes = [], _musicTimer = null;
function initAudio(){
  if(_audioCtx) return;
  try{ _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ _audioCtx=null; }
}
// 溫柔的大調琶音（C-E-G-A 循環，像搖籃曲般平靜）
function playNote(freq, startT, dur, vol){
  if(!_audioCtx) return;
  var osc = _audioCtx.createOscillator();
  var gain = _audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  // 柔和的淡入淡出，不刺耳
  gain.gain.setValueAtTime(0, startT);
  gain.gain.linearRampToValueAtTime(vol, startT + 0.15);
  gain.gain.linearRampToValueAtTime(0, startT + dur);
  osc.connect(gain); gain.connect(_audioCtx.destination);
  osc.start(startT); osc.stop(startT + dur);
  _musicNodes.push(osc);
}
function startMusic(){
  initAudio();
  if(!_audioCtx || _musicOn) return;
  _musicOn = true;
  // C大調溫柔琶音音符（Hz）：C4 E4 G4 A4 G4 E4 …
  var notes = [261.63, 329.63, 392.00, 440.00, 392.00, 329.63];
  var i = 0;
  function loop(){
    if(!_musicOn) return;
    var t = _audioCtx.currentTime;
    // 每個音錯開，形成流動感，音量很小（0.06）
    playNote(notes[i % notes.length], t, 1.8, 0.06);
    // 疊一個低八度襯底，更溫暖
    if(i % 2 === 0) playNote(notes[i % notes.length]/2, t, 2.4, 0.03);
    i++;
    _musicTimer = setTimeout(loop, 900);
  }
  loop();
}
function stopMusic(){
  _musicOn = false;
  if(_musicTimer) clearTimeout(_musicTimer);
}
function toggleMusic(){
  var btn = document.getElementById('music-btn');
  if(_musicOn){ stopMusic(); if(btn) btn.textContent='🔇'; }
  else { startMusic(); if(btn) btn.textContent='🎵'; }
}
</script>
</body>
</html>
