<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元代謝系統・操作教學</title>
<style>
:root{
  --ink:#0F6E56; --ink-deep:#0A4A3A; --mint:#EFF7F3; --paper:#FDFDFB;
  --dark:#1E2B27; --amber:#C97A2B; --amber-bg:#FBF0E1; --mist:#8A9992;
  --red:#B4443C; --red-bg:#FAE8E6; --line:#DCE8E2;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--ink-deep);color:var(--dark);overflow:hidden}

/* ── 劇場舞台 ── */
#theater{height:100%;display:flex;flex-direction:column}
#stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:18px 14px 6px;min-height:0}
#stage{position:relative;width:min(920px,100%);height:100%;max-height:560px;background:var(--mint);border-radius:22px;box-shadow:0 18px 60px rgba(0,0,0,.35);overflow:hidden}
.chapter-eyebrow{position:absolute;top:14px;left:18px;font-size:12px;letter-spacing:.14em;color:var(--ink);font-weight:700;background:rgba(255,255,255,.85);padding:5px 12px;border-radius:999px;z-index:40;border:1px solid var(--line)}

/* ── 場景容器 ── */
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:26px;opacity:0;transition:opacity .5s;pointer-events:none;padding:40px 24px 20px;flex-wrap:wrap}
.scene.on{opacity:1}

/* ── 手機模型 ── */
.phone{width:250px;height:470px;background:#fff;border-radius:28px;border:7px solid #2A3733;box-shadow:0 12px 34px rgba(0,0,0,.22);overflow:hidden;position:relative;flex-shrink:0}
.phone .screen{height:100%;overflow:hidden;background:#F6FAF8;display:flex;flex-direction:column}
.p-head{background:linear-gradient(135deg,var(--ink),#158066);color:#fff;padding:16px 14px 13px;flex-shrink:0}
.p-head .hi{font-size:15px;font-weight:800}
.p-head .sub{font-size:10px;opacity:.85;margin-top:3px}
.p-body{flex:1;overflow:hidden;padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px;font-size:11px;transition:all .4s}
.pcard .t{font-weight:800;font-size:11.5px;margin-bottom:4px;color:var(--dark)}
.pcard .s{color:var(--mist);font-size:10px;line-height:1.5}
.task{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;background:#F2F8F5;margin-top:5px;font-size:10.5px;transition:all .4s}
.task .ck{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--mist);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;transition:all .3s}
.task.done .ck{background:var(--ink);border-color:var(--ink)}
.task.done{background:#E4F2EC}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gbtn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:10px;font-weight:700;color:var(--dark);transition:all .3s}
.gbtn .em{font-size:16px;display:block;margin-bottom:2px}
.inp{border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;background:#fff;color:var(--mist);transition:all .3s;margin-top:5px}
.inp.filled{color:var(--dark);border-color:var(--ink);font-weight:700}
.sendbtn{background:var(--ink);color:#fff;border-radius:9px;padding:9px;text-align:center;font-size:11.5px;font-weight:800;margin-top:7px;transition:all .3s}
.toastp{position:absolute;left:50%;bottom:60px;transform:translateX(-50%) translateY(16px);background:#243430;color:#fff;font-size:10.5px;padding:8px 14px;border-radius:999px;opacity:0;transition:all .4s;white-space:nowrap;z-index:5}
.toastp.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 後台模型 ── */
.admin{width:440px;max-width:96%;height:430px;background:#fff;border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.22);overflow:hidden;display:flex;flex-shrink:0;border:1px solid #C9D8D1}
.a-side{width:104px;background:#12332A;color:#CFE4DB;padding:12px 0;font-size:10.5px;flex-shrink:0}
.a-side .logo{color:#fff;font-weight:800;font-size:11px;padding:0 12px 10px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.a-side .it{padding:7px 12px;transition:all .3s;border-left:3px solid transparent}
.a-side .it.on{background:rgba(255,255,255,.1);color:#fff;border-left-color:#4CC39A;font-weight:700}
.a-main{flex:1;padding:13px 14px;overflow:hidden;background:#F7FAF8;position:relative}
.a-title{font-size:13px;font-weight:800;color:var(--dark);margin-bottom:9px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat .n{font-size:19px;font-weight:800;color:var(--ink)}
.stat .l{font-size:9px;color:var(--mist);margin-top:1px}
.acard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:11px;margin-bottom:7px;transition:all .5s}
.acard.alert{border-left:4px solid var(--red);background:var(--red-bg)}
.acard.alert .t{color:var(--red)}
.acard .t{font-weight:800;font-size:11px;margin-bottom:3px}
.acard .s{font-size:10px;color:var(--mist);line-height:1.5}
.abtns{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.abtn{border:1px solid #D8C4B4;background:#fff;border-radius:7px;padding:4px 9px;font-size:9.5px;font-weight:700;color:#7A5A3E;transition:all .3s}
.abtn.g{background:var(--ink);color:#fff;border-color:var(--ink)}
.acard.faded{opacity:.42}
.rowline{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #EDF3EF;font-size:10.5px}
.rowline .av{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.badge{font-size:8.5px;padding:2px 7px;border-radius:999px;font-weight:800}
.badge.g{background:#DCEFE6;color:var(--ink)}
.badge.a{background:var(--amber-bg);color:var(--amber)}
.aform .inp{margin-top:4px;font-size:10.5px;padding:6px 8px}
.checkline{display:flex;align-items:center;gap:7px;font-size:10.5px;padding:5px 2px;color:var(--dark)}
.checkline .ok{color:var(--ink);font-weight:800}

/* ── Google 表卡片 ── */
.sheetcard{width:250px;background:#fff;border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.18);overflow:hidden;font-size:10px;flex-shrink:0;border:1px solid #C9D8D1}
.sheetcard .bar{background:#188253;color:#fff;padding:8px 11px;font-weight:800;font-size:11px;display:flex;align-items:center;gap:6px}
.sheetcard table{width:100%;border-collapse:collapse}
.sheetcard td,.sheetcard th{border:1px solid #E3EDE7;padding:4.5px 6px;text-align:left;font-size:9.5px}
.sheetcard th{background:#F0F7F3;font-weight:700;color:var(--ink)}
.sheetcard tr.newrow td{background:#FFF7DF;animation:rowin .6s ease}
@keyframes rowin{from{background:#FFE79A}to{background:#FFF7DF}}

/* ── 連接線動畫 ── */
.flowline{position:absolute;height:3px;background:linear-gradient(90deg,var(--ink),#4CC39A);border-radius:3px;opacity:0;transition:opacity .4s;z-index:2}
.flowline.show{opacity:1}
.flowline .dot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:#4CC39A;transform:translateY(-50%);animation:travel 1.4s linear infinite;box-shadow:0 0 10px #4CC39A}
@keyframes travel{from{left:-4px}to{left:calc(100% - 5px)}}

/* ── 指尖光點 ── */
#tap{position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(15,110,86,.28);border:2.5px solid var(--ink);z-index:60;pointer-events:none;transform:translate(-50%,-50%);transition:left .8s cubic-bezier(.5,0,.3,1),top .8s cubic-bezier(.5,0,.3,1),opacity .3s;opacity:0}
#tap.show{opacity:1}
#tap.press{animation:press .5s ease}
@keyframes press{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(.62)}100%{transform:translate(-50%,-50%) scale(1)}}
#tap .ripple{position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--ink);opacity:0}
#tap.press .ripple{animation:rip .55s ease}
@keyframes rip{from{transform:scale(.7);opacity:.8}to{transform:scale(2.1);opacity:0}}

/* ── 字幕與控制列 ── */
#caption-bar{padding:4px 16px 2px;text-align:center}
#caption{display:inline-block;background:rgba(10,40,32,.92);color:#F2FBF7;font-size:clamp(13px,2.4vw,16.5px);line-height:1.65;padding:10px 22px;border-radius:12px;max-width:860px;min-height:44px;font-weight:500;letter-spacing:.02em}
#caption b{color:#7FE0BC;font-weight:800}
#controls{display:flex;align-items:center;gap:12px;padding:10px 18px 16px;max-width:960px;margin:0 auto;width:100%}
.cbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s}
.cbtn:hover{background:rgba(255,255,255,.22)}
.cbtn:focus-visible{outline:2px solid #7FE0BC;outline-offset:2px}
#playbtn{min-width:86px}
#chapters{flex:1;display:flex;gap:6px;align-items:center}
.chdot{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.18);cursor:pointer;position:relative;overflow:hidden;border:none;padding:0}
.chdot:focus-visible{outline:2px solid #7FE0BC;outline-offset:2px}
.chdot .fill{position:absolute;inset:0;width:0%;background:#4CC39A;border-radius:99px;transition:width .3s linear}
.chdot.done .fill{width:100%}
#chlabel{color:rgba(255,255,255,.75);font-size:12px;min-width:118px;text-align:right;letter-spacing:.03em}

/* ── 片頭片尾 ── */
.title-scene{flex-direction:column;text-align:center;gap:14px}
.title-scene h1{font-family:"Noto Serif TC","Microsoft JhengHei",serif;font-size:clamp(26px,5vw,42px);color:var(--ink);font-weight:900;letter-spacing:.06em}
.title-scene .sub{font-size:clamp(13px,2.5vw,17px);color:var(--mist);letter-spacing:.12em}
.trio{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.trio .tcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:13px;font-weight:700;color:var(--dark);box-shadow:0 6px 18px rgba(15,110,86,.1);opacity:0;transform:translateY(14px);transition:all .6s}
.trio .tcard.in{opacity:1;transform:none}
.trio .tcard .em{font-size:26px;display:block;margin-bottom:5px}
.endlist{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 22px;text-align:left;font-size:13px;line-height:2;box-shadow:0 6px 18px rgba(15,110,86,.1)}


/* ── 花園場景 ── */
.garden-sky{background:linear-gradient(180deg,#BFE3F5 0%,#E8F6EE 60%,#D8EFD9 100%);flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:14px}
.g-sun{position:absolute;top:12px;right:16px;font-size:26px;animation:sunspin 14s linear infinite}
@keyframes sunspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.g-cloud{position:absolute;top:26px;left:-40px;font-size:20px;opacity:.8;animation:cloudmove 18s linear infinite}
@keyframes cloudmove{from{left:-40px}to{left:110%}}
.g-tree{font-size:56px;transition:all .8s cubic-bezier(.34,1.56,.64,1);transform-origin:bottom center;position:relative;z-index:3;filter:drop-shadow(0 4px 8px rgba(15,110,86,.25))}
.g-tree.wiggle{animation:wiggle .9s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}60%{transform:rotate(4deg)}}
.g-tree.grown{font-size:76px}
.g-tree.glow{filter:drop-shadow(0 0 18px #FFD75E) drop-shadow(0 4px 8px rgba(15,110,86,.25))}
.g-ground{width:100%;height:22px;background:linear-gradient(180deg,#9CCB9A,#7FB07E);border-radius:50% 50% 0 0/100% 100% 0 0}
.g-label{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.9);border-radius:999px;padding:4px 10px;font-size:9.5px;font-weight:800;color:var(--ink);z-index:4}
.g-drops{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none}
.g-drops span{position:absolute;font-size:15px;opacity:0}
.g-drops.rain span{animation:drop 1s ease forwards}
.g-drops span:nth-child(1){left:-24px;animation-delay:0s}
.g-drops span:nth-child(2){left:0;animation-delay:.18s}
.g-drops span:nth-child(3){left:22px;animation-delay:.36s}
@keyframes drop{0%{transform:translateY(-46px);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.g-spark{position:absolute;font-size:14px;opacity:0;z-index:6;pointer-events:none}
.g-spark.pop{animation:sparkpop 1.3s ease forwards}
@keyframes sparkpop{0%{transform:scale(.3) translateY(6px);opacity:0}35%{opacity:1;transform:scale(1.25) translateY(-8px)}100%{transform:scale(.9) translateY(-26px);opacity:0}}
.g-butterfly{position:absolute;font-size:20px;top:46%;left:-30px;opacity:0;z-index:6}
.g-butterfly.fly{animation:flyin 3.2s ease forwards}
@keyframes flyin{0%{left:-30px;top:52%;opacity:0}15%{opacity:1}40%{left:38%;top:34%}70%{left:60%;top:44%}100%{left:56%;top:38%;opacity:1}}
.g-star{position:absolute;font-size:30px;top:-44px;left:50%;transform:translateX(-50%);opacity:0;z-index:7;filter:drop-shadow(0 0 10px #FFD75E)}
.g-star.fall{animation:starfall 1.6s cubic-bezier(.35,.1,.4,1.3) forwards}
@keyframes starfall{0%{top:-44px;opacity:0;transform:translateX(-50%) rotate(0)}20%{opacity:1}100%{top:44%;opacity:1;transform:translateX(-50%) rotate(340deg)}}
.g-tasks{position:absolute;left:10px;right:10px;bottom:34px;background:rgba(255,255,255,.94);border-radius:11px;padding:8px 10px;font-size:10px;z-index:8;border:1px solid var(--line)}
.g-tasks .tt{font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between}
.travelbtn{position:absolute;top:12px;right:48px;background:rgba(255,255,255,.9);border-radius:999px;padding:4px 9px;font-size:9px;font-weight:800;color:var(--ink);z-index:4;transition:all .3s}
.travelbtn.on{background:var(--ink);color:#fff}

@media (max-width:760px){
  .scene{gap:14px;padding:38px 10px 12px}
  .phone{width:200px;height:380px}
  .admin{width:96%;height:360px}
  .a-side{width:84px}
  .sheetcard{width:210px}
  #chlabel{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01s!important;animation-duration:.01s!important}
.toc-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s}
.toc-btn:hover{background:rgba(255,255,255,.22)}
#toc-panel{position:fixed;inset:0;background:rgba(10,30,25,.55);z-index:500;display:none;align-items:center;justify-content:center;padding:24px}
#toc-panel.open{display:flex}
#toc-box{background:var(--paper);border-radius:16px;max-width:520px;width:100%;max-height:82vh;overflow-y:auto;padding:18px 10px 18px 18px}
#toc-box h2{font-size:16px;font-weight:800;color:var(--ink-deep);margin:0 0 4px;padding-right:8px}
#toc-box .toc-sub{font-size:11.5px;color:var(--mist);margin-bottom:12px;padding-right:8px}
.toc-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--dark);transition:background .15s}
.toc-item:hover{background:var(--mint)}
.toc-item.cur{background:var(--mint);font-weight:800;color:var(--ink-deep)}
.toc-item .toc-n{width:22px;height:22px;border-radius:50%;background:var(--mist);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toc-item.cur .toc-n{background:var(--ink)}
.toc-item.toc-new .toc-n{background:var(--amber)}
#toc-close{position:sticky;top:0;float:right;background:none;border:none;font-size:20px;color:var(--mist);cursor:pointer;line-height:1}
</style>
</head>
<body>
<div id="theater">
  <div id="stage-wrap">
    <div id="stage">
      <div class="chapter-eyebrow" id="eyebrow">操作教學</div>
      <div id="tap"><div class="ripple"></div></div>
      <div id="scenes"></div>
    </div>
  </div>
  <div id="caption-bar"><div id="caption">歡迎收看元代謝系統操作教學</div></div>
  <div id="controls">
    <button class="cbtn" id="playbtn" onclick="togglePlay()">▶ 播放</button>
    <button class="cbtn" id="soundbtn" onclick="toggleSound()" aria-label="語音旁白開關">🔊 語音</button>
    <button class="cbtn" onclick="prevChapter()" aria-label="上一章">⟨ 上一章</button>
    <button class="cbtn" onclick="nextChapter()" aria-label="下一章">下一章 ⟩</button>
    <button class="toc-btn" onclick="openToc()" aria-label="章節目錄">📑 章節目錄</button>
    <div id="chapters" role="tablist" aria-label="章節"></div>
    <div id="chlabel">按播放開始</div>
  </div>
</div>
<div id="toc-panel" onclick="if(event.target.id==='toc-panel')closeToc()">
  <div id="toc-box">
    <button id="toc-close" onclick="closeToc()" aria-label="關閉">✕</button>
    <h2>📑 完整章節目錄</h2>
    <div class="toc-sub">共 <span id="toc-count"></span> 章・點選任一章節直接跳過去</div>
    <div id="toc-list"></div>
  </div>
</div>
<script>
/* ═══════════ 場景 HTML 模板 ═══════════ */
const SCENES = {};

SCENES.intro = `
<div class="scene title-scene" id="sc-intro">
  <h1>元代謝健康管理系統</h1>
  <div class="sub">操 作 教 學・給 第 一 次 使 用 的 你</div>
  <div class="trio">
    <div class="tcard" id="tri1"><span class="em">📱</span>前台<br><span style="font-size:11px;color:var(--mist);font-weight:500">客人使用</span></div>
    <div class="tcard" id="tri2"><span class="em">🖥️</span>後台<br><span style="font-size:11px;color:var(--mist);font-weight:500">秘書工作台</span></div>
    <div class="tcard" id="tri3"><span class="em">📊</span>Google 試算表<br><span style="font-size:11px;color:var(--mist);font-weight:500">所有資料的家</span></div>
  </div>
</div>`;

SCENES.fhome = `
<div class="scene" id="sc-fhome">
  <div class="phone"><div class="screen">
    <div class="p-head"><div class="hi">嗨，陳小美 🌱</div><div class="sub">粒線體期・第 32 天｜連續打卡 12 天</div></div>
    <div class="p-body">
      <div class="pcard" id="fh-video"><div class="t">📽 了解這趟旅程的目標</div><div class="s">5 分鐘影片＋「開始試用」按鈕</div></div>
      <div class="pcard"><div class="t">今日花園任務</div>
        <div class="task" id="fh-task1"><div class="ck">✓</div>🩸 血酮記錄</div>
        <div class="task"><div class="ck">✓</div>📏 體重腰圍</div>
      </div>
      <div class="pcard"><div class="t">功能入口</div>
        <div class="grid2">
          <div class="gbtn" id="fh-qa"><span class="em">💬</span>問答</div>
          <div class="gbtn"><span class="em">🍱</span>外食速查</div>
          <div class="gbtn" id="fh-garden"><span class="em">🌱</span>代謝花園</div>
          <div class="gbtn"><span class="em">🛒</span>好物推薦</div>
        </div>
      </div>
    </div>
    <div class="toastp" id="fh-toast">✅ 記錄已送出</div>
  </div></div>
</div>`;

SCENES.frecord = `
<div class="scene" id="sc-frecord">
  <div class="phone"><div class="screen">
    <div class="p-head"><div class="hi">每日記錄</div><div class="sub">今天的身體，記下來</div></div>
    <div class="p-body">

const g = id => document.getElementById(id);
function show(id){const el=g(id);if(!el)return;el.style.opacity='1';el.classList.add('in')}
function fill(id,text){const el=g(id);if(!el)return;el.textContent=text;el.classList.add('filled')}
function pop(id){const el=g(id);if(!el)return;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function showRow(id){const el=g(id);if(el)el.style.display=''}
function tapEl(id){
  const el=g(id);if(!el)return;
  const st=g('stage').getBoundingClientRect(), r=el.getBoundingClientRect();
  const tap=g('tap');
  tap.style.left=(r.left-st.left+r.width/2)+'px';
  tap.style.top=(r.top-st.top+r.height/2)+'px';
  tap.classList.add('show');
  setTimeout(()=>{tap.classList.add('press');setTimeout(()=>tap.classList.remove('press'),560)},780);
}
function tapThen(id,fn){tapEl(id);setTimeout(fn,1250)}
function placeFlow(id){
  const fl=g(id);if(!fl)return;
  const scene=fl.parentElement, kids=[...scene.children].filter(c=>c!==fl&&!c.classList.contains('flowline'));
  if(kids.length>=2){
    const st=g('stage').getBoundingClientRect();
    const a=kids[0].getBoundingClientRect(), b=kids[1].getBoundingClientRect();
    fl.style.left=(a.right-st.left+4)+'px';
    fl.style.top=((a.top+a.height/2)-st.top)+'px';
    fl.style.width=Math.max(24,(b.left-a.right-8))+'px';
  }
  fl.classList.add('show');
}

/* ── 語音旁白 ── */
let soundOn = true, voicePick = null, advanceToken = 0, speakTimer = null;
function initVoices(){
  if(!('speechSynthesis' in window)) { soundOn=false; const b=g('soundbtn'); if(b){b.textContent='🔇 此裝置不支援'; b.disabled=true;} return; }
  const pick=()=>{
    const vs=speechSynthesis.getVoices();
    voicePick = vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh[-_]HK/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
  };
  pick();
  speechSynthesis.onvoiceschanged = pick;
}
function speakCaption(html, onDone, fallbackMs){
  if(!soundOn || !('speechSynthesis' in window)){ return false; }
  const text = html.replace(/<[^>]+>/g,'').replace(/[💚🎬👋⭐🌱🩸✈️🦋🔔📋✅❌📽💊🌳🌿☀️🌧💧⚖️💭😊💪🍲🫒🥗🍬🍱🛒🤝📄]/g,'');
  try{
    speechSynthesis.cancel();
    let done=false, keepAlive=null;
    const finish=()=>{ if(done)return; done=true; if(keepAlive)clearInterval(keepAlive); onDone(); };
    // Chrome 有個已知 bug：cancel() 後立刻 speak() 常常整句被吃掉、onend 幾乎馬上觸發（字幕還沒唸完就跳下一句）。
    // 延遲一小段再開口，讓 cancel() 真正生效。
    speakTimer = setTimeout(()=>{
      const u = new SpeechSynthesisUtterance(text);
      u.lang='zh-TW'; u.rate=1.02; u.pitch=1;
      if(voicePick) u.voice=voicePick;
      u.onend=finish;
      u.onerror=finish;
      speechSynthesis.speak(u);
      // Chrome 另一個已知 bug：講超過約 15 秒會自動停住但不觸發 onend。
      // 每 5 秒暫停再恢復一次，把它「叫醒」，長字幕才唸得完。
      keepAlive = setInterval(()=>{
        if(!speechSynthesis.speaking){ clearInterval(keepAlive); return; }
        speechSynthesis.pause(); speechSynthesis.resume();
      }, 5000);
    }, 120);
    // 安全網：語音真的卡住也會前進（等足夠久，不搶在正常唸完之前）
    timer=setTimeout(finish, fallbackMs+15000);
    return true;
  }catch(e){ return false; }
}
function toggleSound(){
  soundOn=!soundOn;
  const b=g('soundbtn'); if(b)b.textContent=soundOn?'🔊 語音':'🔇 靜音';
  if(!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
}

/* ── 引擎狀態 ── */
let chIdx=0, stepIdx=0, playing=false, timer=null;
const scenesBox=g('scenes'), captionEl=g('caption'), eyebrow=g('eyebrow'), chlabel=g('chlabel');

function buildChapterDots(){
  const box=g('chapters');
  CHAPTERS.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='chdot';b.setAttribute('role','tab');b.title=c.title;b.setAttribute('aria-label',c.title);
    b.innerHTML='<div class="fill"></div>';
    b.onclick=()=>{gotoChapter(i);if(!playing)togglePlay()};
    box.appendChild(b);
  });
  buildTocList();
}
function buildTocList(){
  const list=g('toc-list'); if(!list) return;
  g('toc-count').textContent = CHAPTERS.length;
  list.innerHTML='';
  CHAPTERS.forEach((c,i)=>{
    const row=document.createElement('div');
    row.className='toc-item'+(i===chIdx?' cur':'')+(c.title.indexOf('（新）')>=0?' toc-new':'');
    row.setAttribute('data-idx', i);
    row.innerHTML='<div class="toc-n">'+(i+1)+'</div><div>'+c.title.replace(/（新）/,' <span style="color:var(--amber);font-weight:800">・新</span>')+'</div>';
    row.onclick=()=>{ closeToc(); gotoChapter(i); if(!playing) togglePlay(); };
    list.appendChild(row);
  });
}
function openToc(){
  buildTocList();
  g('toc-panel').classList.add('open');
  const cur=g('toc-list').querySelector('.cur');
  if(cur) cur.scrollIntoView({block:'center'});
}
function closeToc(){ g('toc-panel').classList.remove('open'); }
function renderScene(i){
  const c=CHAPTERS[i];
  scenesBox.innerHTML=SCENES[c.id];
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const sc=scenesBox.querySelector('.scene');if(sc)sc.classList.add('on');
  }));
  eyebrow.textContent=c.title;
  chlabel.textContent=(i+1)+' / '+CHAPTERS.length+' 章';
  g('tap').classList.remove('show');
  updateDots();
  const tl=g('toc-list');
  if(tl){ [...tl.children].forEach((el,idx)=>el.classList.toggle('cur', idx===i)); }
}
function updateDots(){
  [...document.querySelectorAll('.chdot')].forEach((d,i)=>{
    d.classList.toggle('done',i<chIdx);
    const f=d.querySelector('.fill');
    if(i===chIdx){const steps=CHAPTERS[chIdx].steps.length;f.style.width=Math.round(stepIdx/steps*100)+'%'}
    else if(i>chIdx){f.style.width='0%'}
  });
}
function playStep(){
  if(!playing)return;
  const c=CHAPTERS[chIdx];
  if(stepIdx>=c.steps.length){ // 章節結束
    if(chIdx>=CHAPTERS.length-1){pause();captionEl.innerHTML='🎬 播放完畢——按任一章節可重看';return}
    chIdx++;stepIdx=0;renderScene(chIdx);
    timer=setTimeout(playStep,700);return;
  }
  const s=c.steps[stepIdx];
  captionEl.innerHTML=s.cap;
  if(s.act)try{s.act()}catch(e){}
  stepIdx++;updateDots();
  const myToken = ++advanceToken;
  const goNext=()=>{ if(playing && myToken===advanceToken) playStep(); };
  const dur = s.dur||3000;
  // 有語音：唸完＋緩衝再前進（動作動畫至少跑滿 dur 的 6 成）；沒語音：照原節奏
  const spoke = speakCaption(s.cap, ()=>{ timer=setTimeout(goNext, Math.max(600, dur*0.25)); }, dur);
  if(!spoke) timer=setTimeout(goNext, dur);
}
function togglePlay(){
  playing=!playing;
  g('playbtn').textContent=playing?'⏸ 暫停':'▶ 播放';
  if(playing){if(stepIdx===0&&chIdx===0&&!scenesBox.innerHTML)renderScene(0);playStep()}
  else clearTimeout(timer);
}
function pause(){playing=false;clearTimeout(timer);clearTimeout(speakTimer);advanceToken++;if('speechSynthesis' in window)try{speechSynthesis.cancel()}catch(e){};g('playbtn').textContent='▶ 播放'}
function gotoChapter(i){pause();chIdx=Math.max(0,Math.min(CHAPTERS.length-1,i));stepIdx=0;renderScene(chIdx);captionEl.innerHTML=CHAPTERS[chIdx].title}
function nextChapter(){gotoChapter(chIdx+1);if(!playing)togglePlay()}
function prevChapter(){gotoChapter(chIdx-1);if(!playing)togglePlay()}

buildChapterDots();
initVoices();
renderScene(0);
captionEl.innerHTML='👋 按 <b>▶ 播放</b> 開始教學（約 6 分鐘，含語音旁白，可點 🔊 關閉、點章節跳轉）';
document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();togglePlay()}
  if(e.key==='ArrowRight')nextChapter();
  if(e.key==='ArrowLeft')prevChapter();
});
</script>
