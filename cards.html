<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>元代謝健康 APP 怎麼打開</title>
<style>
:root{--o:#E18A00;--g:#17883A;--b:#B6791E;--t:#0F8B73;--bg:#FFF8ED;--ink:#222;--p:#2A6FC4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b2b2b;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",sans-serif;color:var(--ink);overscroll-behavior:none}
#app{height:100dvh;max-width:520px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;touch-action:pan-y}
.band{flex:none;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;color:#fff;display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.band .badge{background:#fff;color:inherit;border-radius:20px;padding:2px 12px;font-size:16px}
.band .cnt{margin-left:auto;font-size:15px;opacity:.95}
.c-p{background:var(--p)}.c-o{background:var(--o)}.c-g{background:var(--g)}.c-b{background:var(--b)}.c-t{background:var(--t)}
.badge.c-p{color:var(--p)}.badge.c-o{color:var(--o)}.badge.c-g{color:var(--g)}.badge.c-b{color:var(--b)}.badge.c-t{color:var(--t)}
.bar{height:5px;background:rgba(0,0,0,.08);flex:none}.bar i{display:block;height:100%;width:0;background:var(--cur,var(--o));transition:width .25s}
.card{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:14px 18px 6px;text-align:center}
.main{font-size:clamp(28px,8vw,40px);font-weight:900;line-height:1.3;flex:none}
.main b{background:linear-gradient(transparent 55%,#ffe29a 55%);padding:0 3px}
.hint{font-size:clamp(16px,4.4vw,20px);color:#555;margin-top:8px;line-height:1.5;flex:none;min-height:1px}
.vis{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:10px 0}
.vis img{max-height:100%;max-width:78%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.nav{flex:none;display:flex;gap:10px;padding:8px 14px calc(12px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;border-radius:16px;font-size:22px;font-weight:800;padding:14px 0;font-family:inherit}
.nav .prev{background:#e9e1d3;color:#555;flex:.7}
.nav .next{background:var(--cur,var(--o));color:#fff}
.nav button:disabled{opacity:.35}
/* 封面 */
.cover{justify-content:center;gap:16px}
.cover h1{font-size:clamp(36px,11vw,52px);margin:0;font-weight:900}
.cover p{margin:0;font-size:clamp(20px,5.6vw,26px);color:var(--g);font-weight:800}
.cover button.pick{width:100%;border:0;border-radius:18px;padding:20px 10px;font-size:clamp(22px,6.4vw,28px);font-weight:900;color:#fff;font-family:inherit}
.cover small{display:block;font-size:16px;color:rgba(255,255,255,.95);font-weight:600;margin-top:4px}
.pick.n{background:var(--o)}.pick.o{background:var(--t)}
/* 手機框（自己畫的表單） */
.phone{aspect-ratio:560/900;height:100%;max-height:100%;background:#111;border-radius:12cqw;padding:3cqw;container-type:inline-size;position:relative;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.vis .phone{height:100%}
.screen{width:100%;height:100%;border-radius:9.5cqw;background:#e6f2ee;display:flex;align-items:center;justify-content:flex-start;flex-direction:column;padding:12cqw 7cqw 0;overflow:hidden}
.panel{width:100%;background:#fff;border-radius:6cqw;padding:7cqw 6cqw 8cqw;display:flex;flex-direction:column;gap:5cqw;align-items:stretch;text-align:center}
.panel h3{margin:0;font-size:7.2cqw;font-weight:900}
.panel .sub{font-size:3.6cqw;color:#6b7a75;font-weight:700;margin-top:-2cqw}
.fld{border:.7cqw solid #cfe0da;border-radius:4cqw;padding:3.4cqw 4cqw;font-size:5.4cqw;font-weight:800;text-align:left;color:#222;background:#fff;min-height:12cqw}
.fld.ph{color:#9aa8a3;font-weight:600}
.chk{display:flex;gap:3cqw;align-items:center;text-align:left;font-size:3.3cqw;font-weight:700;color:#333;border-radius:3cqw;padding:2cqw}
.chk i{flex:none;width:9cqw;height:9cqw;border-radius:2cqw;background:#0e6b52;color:#fff;font-style:normal;font-size:7cqw;line-height:9cqw;text-align:center}
.cbtn{border-radius:4cqw;padding:3.6cqw 2cqw;font-size:6cqw;font-weight:900;color:#fff;text-align:center}
.cbtn.org{background:var(--o)}.cbtn.grn{background:#0e6b52;font-size:5.4cqw}
.sm{font-size:3.2cqw;color:#2a6fc4;text-decoration:underline;font-weight:700}
.dim{opacity:.32;filter:grayscale(.4)}
.hl{outline:1.2cqw solid #E53935;outline-offset:1cqw;box-shadow:0 0 0 3cqw rgba(229,57,53,.18);opacity:1!important;filter:none!important}
.hl-wrap{position:relative}
/* 圖示卡 */
.big{width:min(56vw,230px);aspect-ratio:1;border-radius:26%;display:flex;align-items:center;justify-content:center}
.big svg{width:62%;height:62%}
.lineico{background:#06C755}
.noico{background:#fff;border:6px solid #E53935}
.chatico{background:#fff;border:6px solid #17883A}
/* 請記住 */
.rem{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;margin-top:6px}
.rem .row{font-size:clamp(24px,7vw,32px);font-weight:900;line-height:1.5}
.rem .arr{font-size:30px;color:var(--g);line-height:1}
.rem .gbtn{background:#0e6b52;border-radius:16px;padding:14px 12px;width:100%}
.rem .gbtn div{border:3px solid #fff;border-radius:12px;padding:14px 6px;color:#fff;font-size:clamp(22px,6.4vw,30px);font-weight:900}
.rem .gbtn small{display:block;font-size:14px;font-weight:600;margin-top:4px}
.rem .bye{font-size:clamp(22px,6vw,28px);font-weight:900;color:var(--g);margin-top:6px}
.dev{display:flex;flex-direction:column;gap:14px;width:100%;margin-top:12px}.dev button,.dev .st{border:0;border-radius:18px;padding:22px 10px;font-size:clamp(24px,7vw,30px);font-weight:900;color:#fff;font-family:inherit;text-align:center}.dev small{display:block;font-size:16px;font-weight:600;margin-top:4px}.dev .a{background:var(--g)}.dev .i{background:var(--p)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;border-radius:20px;padding:6px 16px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none}
</style></head><body>
<div id="app">
  <div class="band" id="band"></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card" id="card"></div>
  <div class="nav"><button class="prev" id="prev">◀ 上一步</button><button class="next" id="next">下一步 ▶</button></div>
</div>

 if(k==='img') return '<img src="'+IMG[a]+'" alt="">';
 if(k==='form_new') return formNew(a);
 if(k==='form_old') return formOld(a);
 if(k==='icon') return '<div class="big '+(a==='line'?'lineico':a==='no'?'noico':'chatico')+'">'+SVG[a]+'</div>';
 return '';
}
function render(){
 var band=document.getElementById('band'),card=document.getElementById('card'),app=document.getElementById('app');
 var prev=document.getElementById('prev'),next=document.getElementById('next'),prog=document.getElementById('prog');
 if(idx<0||!deck){
  band.className='band c-g'; band.innerHTML='元代謝健康'; app.style.setProperty('--cur',COL.g);
  card.className='card cover';
  card.innerHTML='<h1>APP 怎麼打開？</h1><p>每天怎麼再找到它？</p>'+
   '<button class="pick n" onclick="pick(\'n\')">我是新朋友<small>還沒有客人編號</small></button>'+
   '<button class="pick o" onclick="pick(\'o\')">我已經加入過<small>工作人員傳過專屬連結給我</small></button>';
  prev.style.visibility='hidden'; next.style.visibility='hidden'; prog.style.width='0';
  return;
 }
 prev.style.visibility='visible'; next.style.visibility='visible';
 var list=L(),c=list[idx],cls={o:'c-o',g:'c-g',b:'c-b',t:'c-t',p:'c-p'}[c.color];
 band.className='band '+cls;
 band.innerHTML='<span class="badge '+cls+'">'+c.tag+'</span><span>'+(c.v[0]==='remember'?'':'第 '+(idx+1)+' 步')+'</span><span class="cnt">'+(idx+1)+' / '+list.length+'</span>';
 app.style.setProperty('--cur',COL[c.color]);
 prog.style.width=((idx+1)/list.length*100)+'%';
 card.className='card';
 if(c.v[0]==='remember'){
  card.innerHTML='<div class="main" style="font-size:clamp(28px,8vw,38px)">請記住</div><div class="rem"><div class="row">打開 LINE</div><div class="arr">↓</div><div class="row">點「元代謝健康」</div><div class="arr">↓</div><div class="row">按<span style="color:var(--g)">綠色大按鈕</span></div><div class="gbtn"><div>打開 元代謝健康 APP<small>點這裡，直接進入，不用再掃 QR code</small></div></div><div class="bye">祝大家 健康平安！</div></div>';
 } else {
  card.innerHTML='<div class="main">'+c.main+'</div><div class="hint">'+c.hint+'</div><div class="vis">'+visual(c.v)+'</div>';
 }
 prev.disabled=false;
 next.textContent=(idx===list.length-1)?'回到開頭':'下一步 ▶';
 next.style.visibility=(c.v[0]==='device'&&!CAP)?'hidden':'visible';
}
function pick(d){deck=d;dev=null;idx=0;history.replaceState(null,'','#'+d+'1');render();}
function devpick(x){dev=x;idx=idx+1;history.replaceState(null,'','#'+deck+(idx+1)+dev);render();}
function go(n){
 if(!deck){return}
 var len=L().length;
 if(n<0){idx=-1;deck=null;dev=null;history.replaceState(null,'','#');render();return}
 if(n>=len){idx=-1;deck=null;dev=null;history.replaceState(null,'','#');render();return}
 idx=n;history.replaceState(null,'','#'+deck+(idx+1)+(dev||''));render();
}
document.getElementById('next').onclick=function(){go(idx+1)};
document.getElementById('prev').onclick=function(){go(idx-1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
if(/cap=1/.test(location.search)){var st=document.createElement('style');st.textContent='.nav{display:none!important}.card{padding-bottom:18px}';document.head.appendChild(st);}
var sx=null,sy=null;
document.getElementById('card').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.getElementById('card').addEventListener('touchend',function(e){
 if(sx===null||!deck)return; var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy; sx=null;
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0)go(idx+1); else go(idx-1); }
},{passive:true});
// 網址可直接指定：#n1 …… 或 ?v=new / ?v=old
(function(){
 var h=location.hash.replace('#',''),q=(location.search.match(/v=(new|old)/)||[])[1];
 var m=h.match(/^([no])(\d+)([ai]?)$/);
 if(m){deck=m[1];dev=m[3]||null;idx=Math.max(0,Math.min(L().length-1,parseInt(m[2],10)-1))}
 else if(q){deck=q==='new'?'n':'o';idx=0}
 render();
})();
</script></body></html>
