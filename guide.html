<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>元代謝健康 APP 跟著做</title>
<style>
:root{--o:#E18A00;--g:#17883A;--b:#B6791E;--t:#0F8B73;--bg:#FFF8ED;--cur:#E18A00}
img{pointer-events:none;-webkit-touch-callout:none;-webkit-user-drag:none;user-drag:none}
#app{touch-action:manipulation}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#2b2b2b;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",sans-serif;color:#222;overscroll-behavior:none}
#app{height:100dvh;max-width:520px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.band{flex:none;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;color:#fff;display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;background:var(--cur)}
.band .badge{background:#fff;color:var(--cur);border-radius:20px;padding:2px 12px;font-size:16px}
.band .cnt{margin-left:auto;font-size:15px}
.bar{height:5px;background:rgba(0,0,0,.08);flex:none}.bar i{display:block;height:100%;width:0;background:var(--cur);transition:width .35s}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:12px 16px 4px;text-align:center}
.stage.in{animation:slidein .35s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.main{font-size:clamp(26px,7.6vw,38px);font-weight:900;line-height:1.28;flex:none}
.main b{background:linear-gradient(transparent 55%,#ffe29a 55%);padding:0 3px}
.hint{font-size:clamp(15px,4.2vw,19px);color:#555;margin-top:6px;line-height:1.45;flex:none;min-height:1px}
.vis{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:8px 0 4px}
/* 手機 */
.phone{position:relative;aspect-ratio:448/720;height:100%;max-height:100%;max-width:92%;background:#111;border-radius:11% / 6.8%;padding:2.2%;container-type:inline-size;filter:drop-shadow(0 6px 14px rgba(0,0,0,.2))}
.phone.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.screen{position:relative;width:100%;height:100%;border-radius:9% / 5.6%;overflow:hidden;background:#e6f2ee}
.screen>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.imgphone{background:none;padding:0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.2))}
.imgphone .screen{border-radius:0;background:none;overflow:visible}
.imgphone .screen>img{object-fit:contain}
/* 目標：脈動框＋手指 */
.tg{position:absolute;z-index:5;border-radius:3cqw;cursor:pointer}
.tg::before{content:"";position:absolute;inset:-1.4cqw;border:1.2cqw solid #E53935;border-radius:4cqw;animation:pulse 1.1s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(1.12);opacity:0}}
.finger{position:absolute;z-index:9;width:15cqw;height:15cqw;pointer-events:none;animation:bob 1s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));transition:opacity .2s}
.finger svg{width:100%;height:100%}
@keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(-2cqw,-3cqw)}}
.ripple{position:absolute;z-index:10;width:12cqw;height:12cqw;margin:-6cqw 0 0 -6cqw;border-radius:50%;background:rgba(23,136,58,.45);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(2.4);opacity:0}}
.ok{position:absolute;z-index:11;left:50%;top:46%;transform:translate(-50%,-50%) scale(0);background:#17883A;color:#fff;border-radius:50%;width:26cqw;height:26cqw;display:flex;align-items:center;justify-content:center;font-size:16cqw;animation:pop .5s ease-out forwards}
@keyframes pop{60%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1)}}
.hold{position:absolute;z-index:10;width:16cqw;height:16cqw;margin:-8cqw 0 0 -8cqw;border-radius:50%;border:2cqw solid #17883A;opacity:0;pointer-events:none}
.hold.on{opacity:1;animation:holdgrow .7s linear forwards}
@keyframes holdgrow{from{transform:scale(.3)}to{transform:scale(1.6)}}
/* 表單 */
.panel{margin:10cqw 6cqw 0;background:#fff;border-radius:6cqw;padding:6cqw 5cqw 7cqw;display:flex;flex-direction:column;gap:4.6cqw;text-align:center}
.panel h3{margin:0;font-size:6.6cqw;font-weight:900}
.panel .sub{font-size:3.4cqw;color:#6b7a75;font-weight:700;margin-top:-2cqw}
.fld{position:relative;border:.7cqw solid #cfe0da;border-radius:3.6cqw;padding:3cqw 3.6cqw;font-size:5.2cqw;font-weight:800;text-align:left;min-height:11.5cqw;background:#fff;color:#222}
.fld.ph{color:#9aa8a3;font-weight:600}
.fld .cur{display:inline-block;width:.6cqw;height:5.6cqw;background:#222;vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chk{display:flex;gap:3cqw;align-items:center;text-align:left;font-size:3.1cqw;font-weight:700;color:#333;padding:1.5cqw}
.chk i{flex:none;width:8.5cqw;height:8.5cqw;border-radius:2cqw;border:.8cqw solid #9ab;background:#fff;color:#fff;font-style:normal;font-size:6.6cqw;line-height:7.6cqw;text-align:center;transition:.2s}
.chk.on i{background:#0e6b52;border-color:#0e6b52}
.cbtn{border-radius:3.6cqw;padding:3.4cqw 2cqw;font-size:5.6cqw;font-weight:900;color:#fff;text-align:center}
.cbtn.org{background:var(--o)}.cbtn.grn{background:#0e6b52}
.cbtn.off{opacity:.45}
/* 手機主畫面 / 聊天 */
.home{background:linear-gradient(160deg,#4a6fa5,#9bb7d4);display:flex;flex-direction:column;padding:12cqw 8cqw;gap:7cqw;height:100%}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:6cqw 4cqw}
.ap{aspect-ratio:1;border-radius:22%;background:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
.ap.line{background:#06C755;position:relative}
.ap svg{width:62%;height:62%}
.chatbg{background:#8aa4c4;height:100%;position:relative}
.chathead{background:#fff;padding:8cqw 5cqw 3cqw;font-size:4.4cqw;font-weight:900}
.bub{background:#fff;border-radius:3cqw;padding:2.6cqw 3.2cqw;font-size:3.6cqw;font-weight:700;margin:4cqw 4cqw 0;text-align:left;max-width:68%}
.bub.me{background:#9be37f;margin-left:auto}
.inputbar{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:3cqw 4cqw;display:flex;gap:3cqw;align-items:center}
.inputbar .box{flex:1;background:#eee;border-radius:5cqw;padding:2.4cqw 3.6cqw;font-size:3.8cqw;color:#888;text-align:left;font-weight:700;min-height:9cqw}
.inputbar .send{width:9cqw;height:9cqw;border-radius:50%;background:#bbb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:4.6cqw}
.kb{position:absolute;left:0;right:0;bottom:0;height:34%;background:#d3d6dc;transform:translateY(100%);transition:transform .35s;z-index:3}
.kb.up{transform:none}
.kb i{position:absolute;left:4%;right:4%;top:8%;height:70%;background:repeating-linear-gradient(#f4f5f7 0 22%,transparent 22% 33%);border-radius:2cqw;opacity:.9}
.menu{position:absolute;z-index:4;background:#fff;border-radius:3cqw;box-shadow:0 2cqw 6cqw rgba(0,0,0,.3);overflow:hidden;font-size:4cqw;font-weight:800;text-align:left}
.menu div{padding:3.2cqw 5cqw;border-bottom:.3cqw solid #eee}
.menu .del{color:#E53935}
.bigico{width:44cqw;aspect-ratio:1;margin:auto;border-radius:24%;display:flex;align-items:center;justify-content:center}
.bigico svg{width:62%}
/* 底部 */
.ctl{flex:none;display:flex;gap:8px;padding:6px 12px calc(10px + env(safe-area-inset-bottom));align-items:center}
.ctl button{border:0;border-radius:14px;font-size:16px;font-weight:800;padding:12px 10px;white-space:nowrap;font-family:inherit;background:#e9e1d3;color:#555}
.ctl .grow{white-space:nowrap;flex:none;padding:12px 18px;background:var(--cur);color:#fff;display:none;font-size:20px}
.ctl .grow.show{display:block}
.dots{flex:1;display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:#d8cfbd}.dots i.on{background:var(--cur)}.dots i.done{background:var(--cur);opacity:.5}
/* 封面 */
.cover{justify-content:center;gap:14px}
.cover h1{font-size:clamp(34px,10.5vw,50px);margin:0;font-weight:900}
.cover p{margin:0;font-size:clamp(19px,5.4vw,25px);color:var(--g);font-weight:800}
.pick{width:100%;border:0;border-radius:18px;padding:18px 10px;font-size:clamp(22px,6.2vw,27px);font-weight:900;color:#fff;font-family:inherit}
.pick small{display:block;font-size:15px;font-weight:600;margin-top:3px;color:rgba(255,255,255,.95)}
.pick.n{background:var(--o)}.pick.o{background:var(--t)}
.wave{display:inline-block;animation:wv 1.4s infinite}@keyframes wv{50%{transform:translateY(-8px)}}
/* 請記住 */
.rem{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;margin-top:6px}
.rem .row{font-size:clamp(24px,7vw,32px);font-weight:900;opacity:.18;transform:scale(.92);transition:.5s}
.rem .row.on{opacity:1;transform:none}
.rem .arr{font-size:28px;color:var(--g);opacity:.18;transition:.5s;line-height:1}.rem .arr.on{opacity:1}
.rem .gbtn{background:#0e6b52;border-radius:16px;padding:12px;width:100%;opacity:.18;transition:.5s}.rem .gbtn.on{opacity:1}
.rem .gbtn div{border:3px solid #fff;border-radius:12px;padding:12px 6px;color:#fff;font-size:clamp(21px,6vw,28px);font-weight:900}
.rem .gbtn small{display:block;font-size:13px;font-weight:600;margin-top:3px}
.rem .bye{font-size:clamp(22px,6vw,28px);font-weight:900;color:var(--g);margin-top:4px;opacity:0;transition:.5s}.rem .bye.on{opacity:1}
.devwrap{display:flex;flex-direction:column;gap:14px;width:100%;justify-content:center}
.devwrap .pick{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s}
.devwrap .pick .ico{font-size:44px;line-height:1.1;margin-bottom:4px}
.devwrap .pick.on{transform:scale(.95);box-shadow:0 0 0 5px rgba(0,0,0,.18)}
.swwrap{position:absolute;overflow:hidden;z-index:3}
.swpin{position:absolute;left:0;top:0;bottom:0;width:25%;background:#F5A623;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:4.2cqw;gap:.6cqw}
.swpin span{font-size:8cqw;line-height:1}
.swrow{position:absolute;inset:0;background-size:115.5% 680.3%;background-position:56.7% 39.3%;background-repeat:no-repeat;transition:transform .3s ease-out;will-change:transform}
.swrow.drag{transition:none}
.finger.sw{animation:fsw 1.5s ease-in-out infinite}
@keyframes fsw{0%{transform:translateX(0);opacity:1}70%{transform:translateX(20cqw);opacity:1}100%{transform:translateX(20cqw);opacity:0}}
.pinned{position:absolute;z-index:6;right:9cqw;top:36.5%;font-size:7cqw}
.tip{position:absolute;left:50%;top:56%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;border-radius:18px;padding:8px 16px;font-size:16px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;white-space:nowrap}
.tip.show{opacity:1}
</style></head><body>
<div id="app">
  <div class="band" id="band"></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="stage" id="stage"></div>
  <div class="ctl"><button id="prev" aria-label="上一步">◀</button><div class="dots" id="dots"></div><button id="again" aria-label="重來">↻</button><button class="grow" id="go">繼續 ▶</button></div>
  <div class="tip" id="tip">請按有紅框的地方</div>
</div>

function dots(){var d='',n=L().length;for(var i=0;i<n;i++)d+='<i class="'+(i===idx?'on':(i<idx?'done':''))+'"></i>';$('dots').innerHTML=d}

 $('prev').style.visibility='visible';

function place(elId){
 var el=$(elId),tg=document.querySelector('#vis [data-tg]'),fg=document.querySelector('#vis .finger'),sc=document.querySelector('#vis .screen');
 if(!el||!tg||!sc)return; var a=el.getBoundingClientRect(),b=sc.getBoundingClientRect();

 tg.style.left=l+'px';tg.style.top=t+'px';tg.style.width=w+'px';tg.style.height=h+'px';
 if(fg){fg.style.left=(l+w*0.6)+'px';fg.style.top=(t+h*0.5)+'px'}
}
function bind(s){
 var vis=$('vis');
 if(s.type==='device'){
  var bs=vis.querySelectorAll('.devbtn');
  for(var bi=0;bi<bs.length;bi++)(function(b){b.onclick=function(){if(busy)return;busy=true;S.dev=b.getAttribute('data-d');b.classList.add('on');T(next,450)}})(bs[bi]);
  return;
 }
 if(s.type==='form')place('fld_'+s.f);
 if(s.type==='home')place('lineico');
 if(s.type==='msg')place('ib');
 if(s.type==='remember'){
  var rows=document.querySelectorAll('#rem .row,#rem .arr,#rem .gbtn,#rem .bye'),i=0;
  (function step(){ if(i<rows.length){rows[i].classList.add('on');i++;T(step,i%2?500:700)} else {$('go').className='grow show';$('go').textContent='完成 ✓'} })();
  return;
 }
 var ph=vis.querySelector('.phone');
 var hold=null;
 function wrong(){ph.classList.remove('shake');void ph.offsetWidth;ph.classList.add('shake');var t=$('tip');t.classList.add('show');T(function(){t.classList.remove('show')},1500)}
 function inTarget(e){var t=vis.querySelector('[data-tg]');if(!t)return false;var r=t.getBoundingClientRect(),x=e.clientX,y=e.clientY,m=10;return x>=r.left-m&&x<=r.right+m&&y>=r.top-m&&y<=r.bottom+m}
 function rippleAt(e){var sc=vis.querySelector('.screen'),r=sc.getBoundingClientRect(),d=document.createElement('div');d.className='ripple';d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';sc.appendChild(d);T(function(){d.remove()},700)}
 function success(after,delay){
  busy=true;var f=vis.querySelector('.finger');if(f)f.style.opacity=0;
  var sc=vis.querySelector('.screen'),o=document.createElement('div');o.className='ok';o.textContent='✓';sc.appendChild(o);
  T(after||next,delay||900);
 }
 function onDown(e){
  if(busy)return;
  if(!inTarget(e)){wrong();return}
  if(s.type==='swipe'){
   var row=$('swrow'),sc0=vis.querySelector('.screen'),W=sc0.getBoundingClientRect().width,x0=e.clientX,fgr=vis.querySelector('.finger');
   if(fgr)fgr.style.opacity=0;row.classList.add('drag');
   var mv=function(ev){var dx=Math.max(0,Math.min(W*0.25,ev.clientX-x0));row.style.transform='translateX('+dx+'px)'};
   var up=function(ev){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
    row.classList.remove('drag');var dx=ev.clientX-x0;
    if(dx>W*0.1){row.style.transform='translateX(25%)';busy=true;T(next,700)}
    else{row.style.transform='translateX(0)';if(fgr)fgr.style.opacity=1;var t=$('tip');t.textContent='再往右滑一點，像翻頁一樣';t.classList.add('show');T(function(){t.classList.remove('show');t.textContent='請按有紅框的地方'},1600)}};
   document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
   return;
  }
  rippleAt(e);
  if(s.hold){ // 長按
   var sc=vis.querySelector('.screen'),r=sc.getBoundingClientRect(),h=document.createElement('div');h.className='hold on';h.style.left=(e.clientX-r.left)+'px';h.style.top=(e.clientY-r.top)+'px';sc.appendChild(h);
   hold=T(function(){hold=null;h.remove();success(next,500)},750);
   var cancel=function(){if(hold){clearTimeout(hold);hold=null;h.remove();var t=$('tip');t.textContent='手指要按住不放喔';t.classList.add('show');T(function(){t.classList.remove('show');t.textContent='請按有紅框的地方'},1500)}};
   document.addEventListener('pointerup',cancel,{once:true});document.addEventListener('pointercancel',cancel,{once:true});
   return;
  }

   busy=true;var sc=vis.querySelector('.screen');sc.insertAdjacentHTML('beforeend','<div style="position:absolute;inset:0;background:#fff;opacity:.9;z-index:8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3cqw;font-weight:900;font-size:7cqw"><div class="ok" style="position:static;transform:none;animation:pop .5s forwards">✓</div><div>已加入「元代謝健康」</div></div>');

   busy=true;var l=$('lineico');l.style.transition='transform .5s';l.style.transform='scale(8)';l.style.zIndex=9;T(next,600);return;
  }
  if(s.type==='msg'){ msgTap();return }
  if(s.open){ // 打開 APP
   busy=true;var sc2=vis.querySelector('.screen');sc2.insertAdjacentHTML('beforeend','<div style="position:absolute;inset:0;background:#fff;z-index:8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3cqw;font-weight:900;font-size:7cqw;animation:slidein .4s"><div style="font-size:16cqw">🌱</div><div>元代謝健康 APP</div><div style="color:#17883A;font-size:5cqw">已經打開了 ✓</div></div>');
   T(next,1500);return;
  }
  if(s.type==='swipepin'){var sc3=vis.querySelector('.screen');var row3=$('swrow');row3.style.transition='transform .3s';row3.style.transform='translateX(0)';sc3.insertAdjacentHTML('beforeend','<div class="pinned">📌</div>')}
  success();
 }
 vis.addEventListener('pointerdown',onDown);
 vis.style.touchAction='none';
 if(s.type==='nodel'){ $('go').className='grow show';$('go').textContent='知道了 ✓'; var m=vis.querySelector('.menu .del');if(m){m.style.animation='none';m.style.background='#ffe5e5'} }
 function typeInto(el,txt,done){var i=0;el.classList.remove('ph');el.innerHTML='<span class="cur"></span>';(function t(){ if(i<=txt.length){el.innerHTML=txt.slice(0,i)+'<span class="cur"></span>';i++;T(t,230)} else {el.innerHTML=txt;done()}})()}

 }
 // 一段時間沒動作，再提示一次
 T(function(){if(!busy){var t=$('tip');t.textContent='按有紅框的地方就對了';t.classList.add('show');T(function(){t.classList.remove('show');t.textContent='請按有紅框的地方'},2000)}},6000);
}

(function(){

})();
